<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop &amp; Merge Town</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Drop &amp; Merge Town</h1>

  <div id="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Streak: <strong id="streak">0</strong></span>
    <span>Next: <strong id="next"></strong></span>
    <span>Time: <strong id="time">2:00</strong></span>
  </div>

  <div id="board">
    <div id="piece"></div>
    <div id="slots"></div>

    <div id="overlay">
      <div id="screen-menu" class="screen">
        <h2>Main Menu</h2>
        <button id="btn-start">Start Game</button>
        <button id="btn-dashboard">Dashboard</button>
      </div>

      <div id="screen-dashboard" class="screen hidden">
        <h2>High Scores</h2>
        <ol id="score-list"></ol>
        <p id="score-empty">No scores saved yet.</p>
        <button id="btn-back">Back</button>
      </div>

      <div id="screen-gameover" class="screen hidden">
        <h2>Time's up!</h2>
        <p>Score: <strong id="final-score">0</strong></p>
        <form id="save-form">
          <input id="player-name" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
          <button type="submit">Save Score</button>
        </form>
        <button id="btn-again">Play Again</button>
        <button id="btn-menu">Main Menu</button>
      </div>
    </div>
  </div>

  <p id="help">
    Press <kbd>Space</kbd> (or tap above the slots) to drop.
    Click a filled slot to swap its object with the moving one.
  </p>

  <script src="game.js"></script>
</body>
</html>
